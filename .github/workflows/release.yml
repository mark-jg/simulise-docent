# Bouwt bij elke tag v* een zip van de extensie en publiceert die als GitHub Release.
# De extensie controleert /releases/latest; de zip in die release is de downloadlink.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versie in manifest.json moet gelijk zijn aan de tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST="$(node -p "require('./manifest.json').version")"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag v$TAG komt niet overeen met manifest.json ($MANIFEST)"
            exit 1
          fi

      - name: Zip bouwen
        run: |
          mkdir -p dist/simulise-docent
          rsync -a ./ dist/simulise-docent/ \
            --exclude .git --exclude .github --exclude scripts --exclude tools --exclude dist \
            --exclude .gitignore --exclude '.DS_Store' --exclude CLAUDE.md --exclude ROADMAP.md
          cd dist
          zip -qr "simulise-docent-${GITHUB_REF_NAME}.zip" simulise-docent
          ls -l

      - name: Release-notities uit README halen
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          LINE="$(grep -m1 -E "^- ${TAG//./\\.}:" README.md | sed -E 's/^- [^:]+: *//' || true)"
          {
            echo "${LINE:-Versie $TAG.}"
            echo
            echo "**Installeren of bijwerken:** download \`simulise-docent-${GITHUB_REF_NAME}.zip\`, pak uit, vervang de bestanden in je extensiemap en klik op ↻ bij \`chrome://extensions\`. Vanaf 0.2.1 kan het ook met \"Nu bijwerken\" in de extensie."
          } > dist/notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: Versie ${{ github.ref_name }}
          body_path: dist/notes.md
          files: dist/simulise-docent-*.zip
