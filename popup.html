<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 0; padding: 16px; width: 240px; color: #1f2328; }
  h1 { font-size: 14px; margin: 0 0 12px; }
  label { display: flex; align-items: center; gap: 10px; padding: 5px 0; cursor: pointer; }
  .swatch { width: 18px; height: 18px; border-radius: 5px; border: 1px solid rgba(0,0,0,.12); flex: none;
            background: linear-gradient(135deg, var(--a) 50%, var(--b) 50%); }
  small { color: #6b7280; }
  hr { border: 0; border-top: 1px solid #e4e7eb; margin: 10px 0; }
  .themes { display: flex; flex-direction: column; }
</style>
</head>
<body>
  <h1>Simulise Docent</h1>
  <label><input type="checkbox" id="enabled"> Thema inschakelen</label>
  <hr>
  <div class="themes" id="themes"></div>
  <hr>
  <label><input type="checkbox" id="compact"> Compacte weergave</label>
  <script src="popup.js"></script>
</body>
</html>
